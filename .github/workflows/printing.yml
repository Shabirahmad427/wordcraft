# Exercise the native print host and all UI tests on PRs; the broad FreeBSD/ARM64 gates
# stay on their existing nightly/release schedule.
name: Printing

on:
  pull_request:
    paths:
      - 'Cargo*'
      - 'apps/wordcraft/**'
      - 'apps/wordcraft-web/**'
      - 'crates/ui-egui/**'
      - '.github/workflows/printing.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo*'
      - 'apps/wordcraft/**'
      - 'apps/wordcraft-web/**'
      - 'crates/ui-egui/**'
      - '.github/workflows/printing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: printing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Print (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build and software-rendering dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Native clipboard transport regression (Linux X11)
        if: runner.os == 'Linux'
        env:
          WORDCRAFT_NATIVE_CLIPBOARD_TEST: '1'
        run: xvfb-run -a cargo test -p wordcraft --locked native_clipboard_html_plain_text_round_trip -- --nocapture

      - name: Native clipboard transport regression (macOS or Windows)
        if: runner.os != 'Linux'
        env:
          WORDCRAFT_NATIVE_CLIPBOARD_TEST: '1'
        run: cargo test -p wordcraft --locked native_clipboard_html_plain_text_round_trip -- --nocapture

      - name: Native app and UI Clippy
        run: cargo clippy -p wordcraft -p wordcraft-ui-egui --all-targets --locked -- -D warnings

      - name: Native app and UI tests
        run: cargo test -p wordcraft -p wordcraft-ui-egui --locked

      - name: Native window document workflow (Linux X11)
        if: runner.os == 'Linux'
        env:
          WORDCRAFT_NATIVE_WINDOW_SMOKE: '1'
          WGPU_BACKEND: gl
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a cargo test -p wordcraft --test native_window --locked -- isolated_native_ --ignored --nocapture --test-threads=1

      - name: Native window document workflow (macOS or Windows)
        if: runner.os != 'Linux'
        env:
          WORDCRAFT_NATIVE_WINDOW_SMOKE: '1'
          WORDCRAFT_PRESERVE_NATIVE_PROFILE: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: cargo test -p wordcraft --test native_window --locked -- isolated_native_ --ignored --nocapture --test-threads=1

      - name: Preserve failed Windows native smoke diagnostics
        if: runner.os == 'Windows' && failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-smoke-diagnostics
          path: ${{ runner.temp }}/wordcraft-native-smoke-*
          if-no-files-found: warn
          retention-days: 7

      - name: Browser compatibility
        if: runner.os == 'Linux'
        run: cargo check -p wordcraft-web --target wasm32-unknown-unknown --locked
