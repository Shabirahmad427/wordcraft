# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
name: FreeBSD

# The VM build is slow, so it runs nightly on main and on pushes to `release`, not on every push
# or dependency change: a drifted dependency still shows up within a day, and always before a
# release ships. PRs that change the FreeBSD packaging itself still run it.
on:
  schedule:
    - cron: "27 4 * * *"
  push:
    branches: [release]
  pull_request:
    paths:
      - "crates/fonts/**"
      - .github/workflows/freebsd.yml
      - .github/workflows/_shared-freebsd.yml
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    uses: ./.github/workflows/_shared-freebsd.yml # reviewed 2026-10-11
    with:
      craft-fonts-ref: 8dcdacd5153e64560d109541a47d806f26f048c0
