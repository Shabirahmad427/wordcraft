# Exercise generated desktop packages on disposable hosted runners. This workflow never publishes
# a release and never uses the developer's installed application or profile.
name: Native packages

on:
  push:
    branches: [main]
    paths:
      - 'Cargo*'
      - 'apps/wordcraft/**'
      - 'apps/wordcraft-cli/**'
      - 'packaging/**'
      - '.github/workflows/native-packages.yml'
  pull_request:
    paths:
      - 'Cargo*'
      - 'apps/wordcraft/**'
      - 'apps/wordcraft-cli/**'
      - 'packaging/**'
      - '.github/workflows/native-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WORDCRAFT_UPGRADE_BASELINE_SHA: 9270097dfbada244ae9e3b608da7dc9a451905c1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install desktop and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 \
            mesa-vulkan-drivers openbox x11-utils xvfb weston desktop-file-utils xdg-utils
      - uses: storytold/craft-common-actions/actions/install-nfpm@8f081ff5db115de44313c9db09415c359bf2ca01
        with:
          deb-arch: amd64
          nfpm-version: 2.47.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-packages-linux
      - name: Restore the fixed 0.6.1 DEB baseline
        id: baseline-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/upgrade-baseline-linux/wordcraft-0.6.1-linux-x86_64.deb
          key: native-upgrade-baseline-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.WORDCRAFT_UPGRADE_BASELINE_SHA }}
      - name: Build the fork 0.6.1 DEB baseline
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        env:
          WORDCRAFT_BUILD_SHA: ${{ env.WORDCRAFT_UPGRADE_BASELINE_SHA }}
        run: |
          set -euo pipefail
          baseline_dist='${{ runner.temp }}/upgrade-baseline-linux'
          mkdir -p "$baseline_dist"
          git checkout --detach "$WORDCRAFT_UPGRADE_BASELINE_SHA"
          DIST="$baseline_dist" CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" packaging/linux/package.sh --formats deb
          test -s "$baseline_dist/wordcraft-0.6.1-linux-x86_64.deb"
          git checkout --detach "$GITHUB_SHA"
      - name: Cache the fixed 0.6.1 DEB baseline
        if: github.ref == 'refs/heads/main' && steps.baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/upgrade-baseline-linux/wordcraft-0.6.1-linux-x86_64.deb
          key: ${{ steps.baseline-cache.outputs.cache-primary-key }}
      - name: Build deb, rpm and tar packages
        env:
          WORDCRAFT_BUILD_SHA: ${{ github.sha }}
        run: packaging/linux/package.sh --formats deb,rpm,tar
      - name: Install the older DEB and inspect its identity
        run: |
          set -euo pipefail
          deb=(dist/release/wordcraft-*-linux-x86_64.deb)
          rpm=(dist/release/wordcraft-*-linux-x86_64.rpm)
          tarball=(dist/release/wordcraft-*-linux-x86_64.tar.gz)
          test "${#deb[@]}" -eq 1
          test "${#rpm[@]}" -eq 1
          test "${#tarball[@]}" -eq 1
          mkdir -p '${{ runner.temp }}/tar-package'
          tar -xzf "${tarball[0]}" -C '${{ runner.temp }}/tar-package'
          tar_cli="$(find '${{ runner.temp }}/tar-package' -path '*/bin/wordcraft-cli' -type f -print -quit)"
          test -x "$tar_cli"
          "$tar_cli" --version | grep '${{ github.sha }}'
          baseline='${{ runner.temp }}/upgrade-baseline-linux/wordcraft-0.6.1-linux-x86_64.deb'
          sudo apt-get install -y "$baseline"
          test -x /usr/bin/wordcraft
          test -x /usr/bin/wordcraft-cli
          baseline_version="$(dpkg-deb -f "$baseline" Version)"
          test "$(dpkg-query -W -f='${Version}' wordcraft)" = "$baseline_version"
          /usr/bin/wordcraft --version | grep "${WORDCRAFT_UPGRADE_BASELINE_SHA:0:8}"
          /usr/bin/wordcraft-cli --version | grep "$WORDCRAFT_UPGRADE_BASELINE_SHA"
          desktop-file-validate /usr/share/applications/ai.storyteller.wordcraft.desktop
          grep -q 'Exec=wordcraft %F' /usr/share/applications/ai.storyteller.wordcraft.desktop
          grep -q 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' /usr/share/applications/ai.storyteller.wordcraft.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/ai.storyteller.wordcraft.png
          mkdir -p '${{ runner.temp }}/documents'
          printf 'owned by the user\n' > '${{ runner.temp }}/documents/keep.txt'
      - name: Create old-version preferences and a real recovery snapshot
        env:
          WORDCRAFT_NATIVE_EXECUTABLE: /usr/bin/wordcraft
          WORDCRAFT_NATIVE_WINDOW_SMOKE: '1'
          WORDCRAFT_NATIVE_PROFILE_ROOT: ${{ runner.temp }}
          WORDCRAFT_NATIVE_PROFILE_PATH: ${{ runner.temp }}/upgrade-profile
          WORDCRAFT_PRESERVE_NATIVE_PROFILE: '1'
          WORDCRAFT_NATIVE_CONTROL_TRACE: '1'
          RUST_LOG: warn,wordcraft=info,wordcraft::control_server=debug,wordcraft_ui_egui::control=debug
          WGPU_BACKEND: gl
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          bash packaging/linux/with-xvfb-openbox.sh cargo test -p wordcraft --test native_window --locked -- isolated_native_shutdown_checkpoints_recovery_before_exit --ignored --nocapture --test-threads=1
          profile='${{ runner.temp }}/upgrade-profile/xdg/wordcraft'
          test -s "$profile/ui.json"
          find "$profile/recovery" -type f -name '*.wcr' -print -quit | grep -q .
          find "$profile" -type f \( -name ui.json -o -name '*.wcr' \) -print0 | sort -z | xargs -0 sha256sum > '${{ runner.temp }}/upgrade-profile-state.sha256'
      - name: Upgrade to the current DEB and verify package and user data
        run: |
          set -euo pipefail
          current=(dist/release/wordcraft-*-linux-x86_64.deb)
          test "${#current[@]}" -eq 1
          current_package="./${current[0]}"
          test -f "$current_package"
          package_version="$(dpkg-deb -f "$current_package" Version)"
          sudo apt-get install --reinstall -y "$current_package"
          test "$(dpkg-query -W -f='${Version}' wordcraft)" = "$package_version"
          test -x /usr/bin/wordcraft
          test -x /usr/bin/wordcraft-cli
          /usr/bin/wordcraft --version | grep "${GITHUB_SHA:0:8}"
          /usr/bin/wordcraft-cli --version | grep '${{ github.sha }}'
          profile='${{ runner.temp }}/upgrade-profile/xdg/wordcraft'
          find "$profile" -type f \( -name ui.json -o -name '*.wcr' \) -print0 | sort -z | xargs -0 sha256sum > '${{ runner.temp }}/upgrade-profile-state-after-install.sha256'
          diff -u '${{ runner.temp }}/upgrade-profile-state.sha256' '${{ runner.temp }}/upgrade-profile-state-after-install.sha256'
          grep -q 'owned by the user' '${{ runner.temp }}/documents/keep.txt'
      - name: Edit, save, export and quit the installed app under X11
        env:
          WORDCRAFT_NATIVE_EXECUTABLE: /usr/bin/wordcraft
          WORDCRAFT_NATIVE_WINDOW_SMOKE: '1'
          WORDCRAFT_NATIVE_PROFILE_ROOT: ${{ runner.temp }}
          WORDCRAFT_PRESERVE_NATIVE_PROFILE: '1'
          WORDCRAFT_NATIVE_CONTROL_TRACE: '1'
          RUST_LOG: warn,wordcraft=info,wordcraft::control_server=debug,wordcraft_ui_egui::control=debug
          WGPU_BACKEND: gl
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          bash packaging/linux/with-xvfb-openbox.sh cargo test -p wordcraft --test native_window --locked -- isolated_native_ --ignored --nocapture --test-threads=1
          WORDCRAFT_NATIVE_PROFILE_PATH='${{ runner.temp }}/upgrade-profile' WORDCRAFT_NATIVE_EXPECT_THEME=dark bash packaging/linux/with-xvfb-openbox.sh cargo test -p wordcraft --test native_window --locked -- isolated_native_window_smoke --ignored --nocapture --test-threads=1
      - name: Resolve DOCX through the installed XDG MIME entry
        run: |
          set -euo pipefail
          docx="$(find '${{ runner.temp }}' -name desktop-smoke.docx -type f -print -quit)"
          test -n "$docx"
          mime=application/vnd.openxmlformats-officedocument.wordprocessingml.document
          test "$(xdg-mime query filetype "$docx")" = "$mime"
          mkdir -p '${{ runner.temp }}/xdg-association'
          export XDG_CONFIG_HOME='${{ runner.temp }}/xdg-association'
          xdg-mime default ai.storyteller.wordcraft.desktop "$mime"
          test "$(xdg-mime query default "$mime")" = ai.storyteller.wordcraft.desktop
      - name: Start and quit the installed app under native Wayland
        env:
          WORDCRAFT_NATIVE_EXECUTABLE: /usr/bin/wordcraft
          WORDCRAFT_NATIVE_WINDOW_SMOKE: '1'
          WORDCRAFT_NATIVE_PROFILE_ROOT: ${{ runner.temp }}
          WORDCRAFT_PRESERVE_NATIVE_PROFILE: '1'
          WGPU_BACKEND: gl
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: bash packaging/linux/wayland-smoke.sh
      - name: Uninstall without deleting a user document
        run: |
          sudo apt-get remove -y wordcraft
          test ! -e /usr/bin/wordcraft
          test ! -e /usr/share/applications/ai.storyteller.wordcraft.desktop
          grep -q 'owned by the user' '${{ runner.temp }}/documents/keep.txt'
          find '${{ runner.temp }}' -path '*/xdg/wordcraft/ui.json' -type f | grep -q .
          find '${{ runner.temp }}' -path '*/xdg/wordcraft/recovery/*.wcr' -type f | grep -q .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordcraft-linux-x86_64-test-packages
          path: dist/release/*
          if-no-files-found: error
          retention-days: 90
      - name: Preserve package failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-package-diagnostics
          path: |
            ${{ runner.temp }}/wordcraft-native-smoke-*/wordcraft.stderr.log
            ${{ runner.temp }}/wordcraft-native-smoke-*/*.png
            ${{ runner.temp }}/wordcraft-wayland.*/weston.log
          if-no-files-found: warn
          retention-days: 90

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      WORDCRAFT_UPGRADE_BASELINE_SHA: 9270097dfbada244ae9e3b608da7dc9a451905c1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-packages-macos
      - name: Restore the fixed 0.6.1 DMG baseline
        id: baseline-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/upgrade-baseline-macos/wordcraft-0.6.1-macos-aarch64.dmg
          key: native-upgrade-baseline-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.WORDCRAFT_UPGRADE_BASELINE_SHA }}
      - name: Build the fork 0.6.1 DMG baseline
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        env:
          WORDCRAFT_BUILD_SHA: ${{ env.WORDCRAFT_UPGRADE_BASELINE_SHA }}
        run: |
          set -euo pipefail
          baseline_dist='${{ runner.temp }}/upgrade-baseline-macos'
          mkdir -p "$baseline_dist"
          git checkout --detach "$WORDCRAFT_UPGRADE_BASELINE_SHA"
          DIST="$baseline_dist" CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" packaging/macos/package.sh --arch aarch64
          test -s "$baseline_dist/wordcraft-0.6.1-macos-aarch64.dmg"
          git checkout --detach "$GITHUB_SHA"
      - name: Cache the fixed 0.6.1 DMG baseline
        if: github.ref == 'refs/heads/main' && steps.baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/upgrade-baseline-macos/wordcraft-0.6.1-macos-aarch64.dmg
          key: ${{ steps.baseline-cache.outputs.cache-primary-key }}
      - name: Build the Apple Silicon DMG
        env:
          WORDCRAFT_BUILD_SHA: ${{ github.sha }}
        run: packaging/macos/package.sh --arch aarch64
      - name: Install the actual DMG app into a disposable Applications directory
        run: |
          set -euo pipefail
          dmg=(dist/release/wordcraft-*-macos-aarch64.dmg)
          test "${#dmg[@]}" -eq 1
          mkdir -p '${{ runner.temp }}/wordcraft-volume' '${{ runner.temp }}/Applications' '${{ runner.temp }}/documents'
          hdiutil attach -nobrowse -readonly -mountpoint '${{ runner.temp }}/wordcraft-volume' "${dmg[0]}"
          ditto '${{ runner.temp }}/wordcraft-volume/WordCraft.app' '${{ runner.temp }}/Applications/WordCraft.app'
          hdiutil detach '${{ runner.temp }}/wordcraft-volume'
          app='${{ runner.temp }}/Applications/WordCraft.app'
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" = WordCraft
          test "$(/usr/libexec/PlistBuddy -c 'Print :WordCraftBuildCommit' "$app/Contents/Info.plist")" = '${{ github.sha }}'
          codesign --verify --strict --deep "$app"
          lipo -archs "$app/Contents/MacOS/WordCraft" | grep -qw arm64
          "$app/Contents/MacOS/WordCraft" --version | grep "${GITHUB_SHA:0:8}"
          mkdir -p '${{ runner.temp }}/cli-zip'
          ditto -x -k dist/release/wordcraft-cli-*-macos-aarch64.zip '${{ runner.temp }}/cli-zip'
          cli="$(find '${{ runner.temp }}/cli-zip' -name wordcraft-cli -type f -print -quit)"
          test -x "$cli"
          "$cli" --version | grep '${{ github.sha }}'
          printf 'owned by the user\n' > '${{ runner.temp }}/documents/keep.txt'
      - name: Install the older app and create isolated upgrade data
        env:
          WORDCRAFT_NATIVE_APP_BUNDLE: ${{ runner.temp }}/Applications/WordCraft.app
          WORDCRAFT_NATIVE_WINDOW_SMOKE: '1'
          WORDCRAFT_NATIVE_PROFILE_ROOT: ${{ runner.temp }}
          WORDCRAFT_NATIVE_PROFILE_PATH: ${{ runner.temp }}/upgrade-profile
          WORDCRAFT_PRESERVE_NATIVE_PROFILE: '1'
          WORDCRAFT_NATIVE_CONTROL_TRACE: '1'
          RUST_LOG: warn,wordcraft=info,wordcraft::control_server=debug,wordcraft_ui_egui::control=debug
        run: |
          set -euo pipefail
          baseline='${{ runner.temp }}/upgrade-baseline-macos/wordcraft-0.6.1-macos-aarch64.dmg'
          mkdir -p '${{ runner.temp }}/old-volume'
          rm -rf '${{ runner.temp }}/Applications/WordCraft.app'
          hdiutil attach -nobrowse -readonly -mountpoint '${{ runner.temp }}/old-volume' "$baseline"
          ditto '${{ runner.temp }}/old-volume/WordCraft.app' '${{ runner.temp }}/Applications/WordCraft.app'
          hdiutil detach '${{ runner.temp }}/old-volume'
          app='${{ runner.temp }}/Applications/WordCraft.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = ai.storyteller.wordcraft
          test "$(/usr/libexec/PlistBuddy -c 'Print :WordCraftVersion' "$app/Contents/Info.plist")" = 0.6.1
          test "$(/usr/libexec/PlistBuddy -c 'Print :WordCraftBuildCommit' "$app/Contents/Info.plist")" = "$WORDCRAFT_UPGRADE_BASELINE_SHA"
          "$app/Contents/MacOS/WordCraft" --version | grep "${WORDCRAFT_UPGRADE_BASELINE_SHA:0:8}"
          cargo test -p wordcraft --test native_window --locked -- isolated_native_shutdown_checkpoints_recovery_before_exit --ignored --nocapture --test-threads=1
          profile='${{ runner.temp }}/upgrade-profile/Library/Application Support/WordCraft'
          test -s "$profile/ui.json"
          find "$profile/recovery" -type f -name '*.wcr' -print -quit | grep -q .
          find "$profile" -type f \( -name ui.json -o -name '*.wcr' \) -print0 | sort -z | xargs -0 shasum -a 256 > '${{ runner.temp }}/upgrade-profile-state.sha256'
      - name: Replace old app with current DMG build and verify retained user data
        env:
          WORDCRAFT_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_version="$(awk '/^\[workspace.package\]/{in_package=1;next} /^\[/{in_package=0} in_package && /^version[[:space:]]*=/{gsub(/[" ]/, "", $3);print $3;exit}' Cargo.toml)"
          test -n "$current_version"
          dmg=(dist/release/wordcraft-*-macos-aarch64.dmg)
          test "${#dmg[@]}" -eq 1
          mkdir -p '${{ runner.temp }}/current-volume'
          hdiutil attach -nobrowse -readonly -mountpoint '${{ runner.temp }}/current-volume' "${dmg[0]}"
          source_app='${{ runner.temp }}/current-volume/WordCraft.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$source_app/Contents/Info.plist")" = ai.storyteller.wordcraft
          test "$(/usr/libexec/PlistBuddy -c 'Print :WordCraftBuildCommit' "$source_app/Contents/Info.plist")" = '${{ github.sha }}'
          codesign --verify --strict --deep "$source_app"
          rm -rf '${{ runner.temp }}/Applications/WordCraft.app'
          ditto "$source_app" '${{ runner.temp }}/Applications/WordCraft.app'
          hdiutil detach '${{ runner.temp }}/current-volume'
          app='${{ runner.temp }}/Applications/WordCraft.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :WordCraftVersion' "$app/Contents/Info.plist")" = "$current_version"
          "$app/Contents/MacOS/WordCraft" --version | grep "${GITHUB_SHA:0:8}"
          profile='${{ runner.temp }}/upgrade-profile/Library/Application Support/WordCraft'
          find "$profile" -type f \( -name ui.json -o -name '*.wcr' \) -print0 | sort -z | xargs -0 shasum -a 256 > '${{ runner.temp }}/upgrade-profile-state-after-install.sha256'
          diff -u '${{ runner.temp }}/upgrade-profile-state.sha256' '${{ runner.temp }}/upgrade-profile-state-after-install.sha256'
          grep -q 'owned by the user' '${{ runner.temp }}/documents/keep.txt'
      - name: Launch upgraded app with preserved profile and verify normal shutdown
        env:
          WORDCRAFT_NATIVE_APP_BUNDLE: ${{ runner.temp }}/Applications/WordCraft.app
          WORDCRAFT_NATIVE_WINDOW_SMOKE: '1'
          WORDCRAFT_NATIVE_PROFILE_ROOT: ${{ runner.temp }}
          WORDCRAFT_NATIVE_PROFILE_PATH: ${{ runner.temp }}/upgrade-profile
          WORDCRAFT_NATIVE_EXPECT_THEME: dark
          WORDCRAFT_PRESERVE_NATIVE_PROFILE: '1'
          WORDCRAFT_NATIVE_CONTROL_TRACE: '1'
          RUST_LOG: warn,wordcraft=info,wordcraft::control_server=debug,wordcraft_ui_egui::control=debug
        run: cargo test -p wordcraft --test native_window --locked -- isolated_native_window_smoke --ignored --nocapture --test-threads=1
      - name: Edit, save, export and quit the installed app through LaunchServices
        env:
          WORDCRAFT_NATIVE_APP_BUNDLE: ${{ runner.temp }}/Applications/WordCraft.app
          WORDCRAFT_NATIVE_WINDOW_SMOKE: '1'
          WORDCRAFT_NATIVE_PROFILE_ROOT: ${{ runner.temp }}
          WORDCRAFT_PRESERVE_NATIVE_PROFILE: '1'
        run: cargo test -p wordcraft --test native_window --locked -- isolated_native_ --ignored --nocapture --test-threads=1
      - name: Remove the app without deleting a user document
        run: |
          test -f '${{ runner.temp }}/documents/keep.txt'
          rm -rf '${{ runner.temp }}/Applications/WordCraft.app'
          test ! -e '${{ runner.temp }}/Applications/WordCraft.app'
          grep -q 'owned by the user' '${{ runner.temp }}/documents/keep.txt'
          find '${{ runner.temp }}' -path '*/Library/Application Support/WordCraft/ui.json' -type f | grep -q .
          find '${{ runner.temp }}' -path '*/Library/Application Support/WordCraft/recovery/*.wcr' -type f | grep -q .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordcraft-macos-arm64-test-packages
          path: dist/release/*
          if-no-files-found: error
          retention-days: 90
      - name: Preserve package failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-package-diagnostics
          path: |
            ${{ runner.temp }}/wordcraft-native-smoke-*/wordcraft.stderr.log
            ${{ runner.temp }}/wordcraft-native-smoke-*/*.png
          if-no-files-found: warn
          retention-days: 90

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WORDCRAFT_UPGRADE_BASELINE_SHA: 9270097dfbada244ae9e3b608da7dc9a451905c1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-packages-windows
      - uses: storytold/craft-common-actions/actions/install-wix@8f081ff5db115de44313c9db09415c359bf2ca01
        with:
          wix-version: 5.0.2
      - name: Restore the fixed 0.6.1 MSI baseline
        id: baseline-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/upgrade-baseline-windows/wordcraft-0.6.1-windows-x64.msi
          key: native-upgrade-baseline-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.WORDCRAFT_UPGRADE_BASELINE_SHA }}
      - name: Build the fork 0.6.1 MSI baseline
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baselineDist = Join-Path $env:RUNNER_TEMP 'upgrade-baseline-windows'
          New-Item -ItemType Directory -Force $baselineDist | Out-Null
          git checkout --detach $env:WORDCRAFT_UPGRADE_BASELINE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'could not select baseline commit' }
          $env:WORDCRAFT_BUILD_SHA = $env:WORDCRAFT_UPGRADE_BASELINE_SHA
          $env:DIST = $baselineDist
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target'
          ./packaging/windows/package.ps1 -Arch x64
          if (-not (Test-Path (Join-Path $baselineDist 'wordcraft-0.6.1-windows-x64.msi'))) { throw 'baseline 0.6.1 MSI was not created' }
          git checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'could not restore tested commit' }
      - name: Cache the fixed 0.6.1 MSI baseline
        if: github.ref == 'refs/heads/main' && steps.baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/upgrade-baseline-windows/wordcraft-0.6.1-windows-x64.msi
          key: ${{ steps.baseline-cache.outputs.cache-primary-key }}
      - name: Build x64 MSI and portable ZIP
        shell: pwsh
        env:
          WORDCRAFT_BUILD_SHA: ${{ github.sha }}
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Install older MSI and inspect identity and native integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inWorkspacePackage = $false
          $currentVersion = $null
          foreach ($line in Get-Content Cargo.toml) {
            if ($line -eq '[workspace.package]') { $inWorkspacePackage = $true; continue }
            if ($line -match '^\[') { $inWorkspacePackage = $false }
            if ($inWorkspacePackage -and $line -match '^\s*version\s*=\s*"([^"]+)"') { $currentVersion = ($Matches[1] -split '-')[0]; break }
          }
          if (-not $currentVersion) { throw 'could not read current workspace package version' }
          $baselineMsi = Join-Path $env:RUNNER_TEMP 'upgrade-baseline-windows\wordcraft-0.6.1-windows-x64.msi'
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$baselineMsi`"", '/qn', '/norestart', '/l*v', "`"$env:RUNNER_TEMP\wordcraft-old-install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\wordcraft-old-install.log" -Tail 80; throw "old MSI install exited $($p.ExitCode)" }
          $oldEntry = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -eq 'WordCraft' } | Select-Object -First 1
          if (-not $oldEntry -or $oldEntry.DisplayVersion -ne '0.6.1') { throw 'baseline MSI uninstall identity/version missing' }
          $oldExe = Join-Path $env:ProgramFiles 'WordCraft\wordcraft.exe'
          if (-not (Test-Path $oldExe)) { throw 'older MSI executable is missing' }
          $oldGuiVersion = & $oldExe --version | Out-String
          $baselineShortSha = $env:WORDCRAFT_UPGRADE_BASELINE_SHA.Substring(0, 8)
          if ($LASTEXITCODE -ne 0 -or $oldGuiVersion -notlike "*$baselineShortSha*") { throw "baseline MSI executable build identity mismatch: $oldGuiVersion" }
          $upgradeProfile = Join-Path $env:RUNNER_TEMP 'upgrade-profile'
          New-Item -ItemType Directory -Force $upgradeProfile | Out-Null
          $env:WORDCRAFT_NATIVE_EXECUTABLE = $oldExe
          $env:WORDCRAFT_NATIVE_WINDOW_SMOKE = '1'
          $env:WORDCRAFT_NATIVE_PROFILE_ROOT = $env:RUNNER_TEMP
          $env:WORDCRAFT_NATIVE_PROFILE_PATH = $upgradeProfile
          $env:WORDCRAFT_PRESERVE_NATIVE_PROFILE = '1'
          $env:WORDCRAFT_NATIVE_CONTROL_TRACE = '1'
          $env:RUST_LOG = 'warn,wordcraft=info,wordcraft::control_server=debug,wordcraft_ui_egui::control=debug'
          cargo test -p wordcraft --test native_window --locked -- isolated_native_shutdown_checkpoints_recovery_before_exit --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "old installed GUI recovery smoke exited $LASTEXITCODE" }
          $profile = Join-Path $upgradeProfile 'AppData\WordCraft'
          if (-not (Test-Path (Join-Path $profile 'ui.json'))) { throw 'old version did not save isolated preferences' }
          if (-not (Get-ChildItem (Join-Path $profile 'recovery') -Filter '*.wcr' -ErrorAction SilentlyContinue)) { throw 'old version did not leave a recovery snapshot' }
          $before = Get-ChildItem $profile -Recurse -File | Where-Object { $_.Name -eq 'ui.json' -or $_.Extension -eq '.wcr' } | Sort-Object FullName | ForEach-Object { "$($_.FullName.Substring($profile.Length)) $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" }
          Set-Content (Join-Path $env:RUNNER_TEMP 'upgrade-profile-state.txt') $before
          $msi = (Get-ChildItem dist/release/*-windows-x64.msi | Select-Object -First 1).FullName
          if (-not $msi) { throw 'x64 MSI was not produced' }
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$env:RUNNER_TEMP\wordcraft-install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\wordcraft-install.log" -Tail 80; throw "MSI install exited $($p.ExitCode)" }
          $currentEntries = @(Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -eq 'WordCraft' })
          if ($currentEntries.Count -ne 1 -or $currentEntries[0].DisplayVersion -ne $currentVersion) { throw "current MSI upgrade metadata mismatch: $($currentEntries | ConvertTo-Json -Compress)" }
          $dir = Join-Path $env:ProgramFiles 'WordCraft'
          $exe = Join-Path $dir 'wordcraft.exe'
          $cli = Join-Path $dir 'wordcraft-cli.exe'
          if (-not ((Test-Path $exe) -and (Test-Path $cli))) { throw "installed binaries missing in $dir" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'WordCraft.lnk'))) { throw 'Start Menu shortcut missing' }
          $open = (Get-Item 'HKLM:\Software\Classes\WordCraft.Document\shell\open\command').GetValue('')
          if ($open -notlike '*wordcraft.exe*%1*') { throw "DOCX Open With command missing: $open" }
          $version = & $cli --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notlike '*${{ github.sha }}*') { throw "installed CLI has wrong commit: $version" }
          $guiVersion = & $exe --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $guiVersion -notlike '*${{ github.sha }}*') { throw "installed GUI has wrong commit: $guiVersion" }
          $profile = Join-Path (Join-Path $env:RUNNER_TEMP 'upgrade-profile') 'AppData\WordCraft'
          $after = Get-ChildItem $profile -Recurse -File | Where-Object { $_.Name -eq 'ui.json' -or $_.Extension -eq '.wcr' } | Sort-Object FullName | ForEach-Object { "$($_.FullName.Substring($profile.Length)) $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" }
          $before = Get-Content (Join-Path $env:RUNNER_TEMP 'upgrade-profile-state.txt')
          if (Compare-Object $before $after) { throw 'MSI upgrade changed isolated preferences or recovery snapshots' }
          if ((Get-Content (Join-Path $env:RUNNER_TEMP 'documents\keep.txt')) -ne 'owned by the user') { throw 'MSI upgrade changed user document' }
          $zip = (Get-ChildItem dist/release/*-windows-x64-portable.zip | Select-Object -First 1).FullName
          if (-not $zip) { throw 'portable ZIP was not produced' }
          $portable = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive $zip $portable
          $portableCli = (Get-ChildItem $portable -Recurse -Filter wordcraft-cli.exe | Select-Object -First 1).FullName
          if (-not $portableCli) { throw 'portable ZIP has no CLI' }
          $portableVersion = & $portableCli --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $portableVersion -notlike '*${{ github.sha }}*') { throw "portable CLI has wrong commit: $portableVersion" }
          $documents = Join-Path $env:RUNNER_TEMP 'documents'
          New-Item -ItemType Directory -Force $documents | Out-Null
          Set-Content (Join-Path $documents 'keep.txt') 'owned by the user'
      - name: Edit, save, export and quit the installed GUI
        shell: pwsh
        env:
          WORDCRAFT_NATIVE_WINDOW_SMOKE: '1'
          WORDCRAFT_NATIVE_PROFILE_ROOT: ${{ runner.temp }}
          WORDCRAFT_PRESERVE_NATIVE_PROFILE: '1'
          WORDCRAFT_NATIVE_CONTROL_TRACE: '1'
          RUST_LOG: warn,wordcraft=info,wordcraft::control_server=debug,wordcraft_ui_egui::control=debug
        run: |
          $env:WORDCRAFT_NATIVE_EXECUTABLE = Join-Path $env:ProgramFiles 'WordCraft\wordcraft.exe'
          cargo test -p wordcraft --test native_window --locked -- isolated_native_ --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "installed GUI smoke exited $LASTEXITCODE" }
      - name: Launch upgraded MSI with preserved profile
        shell: pwsh
        env:
          WORDCRAFT_NATIVE_WINDOW_SMOKE: '1'
          WORDCRAFT_NATIVE_PROFILE_ROOT: ${{ runner.temp }}
          WORDCRAFT_NATIVE_PROFILE_PATH: ${{ runner.temp }}/upgrade-profile
          WORDCRAFT_NATIVE_EXPECT_THEME: dark
          WORDCRAFT_PRESERVE_NATIVE_PROFILE: '1'
          WORDCRAFT_NATIVE_CONTROL_TRACE: '1'
          RUST_LOG: warn,wordcraft=info,wordcraft::control_server=debug,wordcraft_ui_egui::control=debug
        run: |
          $env:WORDCRAFT_NATIVE_EXECUTABLE = Join-Path $env:ProgramFiles 'WordCraft\wordcraft.exe'
          cargo test -p wordcraft --test native_window --locked -- isolated_native_window_smoke --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "upgraded profile GUI smoke exited $LASTEXITCODE" }
      - name: Uninstall without deleting a user document
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/release/*-windows-x64.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI uninstall exited $($p.ExitCode)" }
          if (Test-Path (Join-Path $env:ProgramFiles 'WordCraft\wordcraft.exe')) { throw 'uninstall left GUI executable' }
          if ((Get-Content (Join-Path $env:RUNNER_TEMP 'documents\keep.txt')) -ne 'owned by the user') { throw 'uninstall changed user document' }
          $profiles = Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'wordcraft-native-smoke-*'
          $retained = @($profiles | Where-Object {
            (Test-Path (Join-Path $_.FullName 'AppData\WordCraft\ui.json')) -and
            (Get-ChildItem (Join-Path $_.FullName 'AppData\WordCraft\recovery') -Filter '*.wcr' -ErrorAction SilentlyContinue)
          })
          if ($retained.Count -eq 0) { throw 'uninstall removed isolated preferences or recovery entries' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordcraft-windows-x64-test-packages
          path: dist/release/*
          if-no-files-found: error
          retention-days: 90
      - name: Preserve package failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package-diagnostics
          path: |
            ${{ runner.temp }}/wordcraft-native-smoke-*/wordcraft.stderr.log
            ${{ runner.temp }}/wordcraft-native-smoke-*/*.png
          if-no-files-found: warn
          retention-days: 90
